<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ifels</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 0 20px;
      line-height: 1.6;
    }

    /* 与 control-flex 站点一致的语言切换样式 */
    .page-top {
      display: flex;
      justify-content: flex-end;
      margin: -26px 0 4px;
    }
    .lang-switch {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 3px;
      border: 1px solid #ccd3de;
      border-radius: 7px;
      background: #eef1f5;
      font-size: 13px;
      white-space: nowrap;
    }
    .lang-switch a,
    .lang-switch .lang-current {
      padding: 2px 8px;
      border-radius: 5px;
      line-height: 1.5;
      text-decoration: none;
      transition: background .15s, color .15s;
    }
    .lang-switch a { color: #5f6b7d; }
    .lang-switch a:hover {
      background: #e3e7ee;
      color: #171c26;
    }
    .lang-switch .lang-current {
      background: #fff;
      color: #171c26;
      box-shadow: 0 1px 2px rgba(16, 24, 40, .06);
    }

    .section-title {
      margin-top: 40px;
      font-size: 20px;
    }
    .project-card {
      display: block;
      margin-top: 10px;
      padding: 16px 18px;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      text-decoration: none;
      color: inherit;
    }
    .project-card:hover {
      border-color: #1f9d55;
      background: #f6f8fa;
    }
    .project-card-title {
      display: block;
      font-weight: 600;
      color: #1f9d55;
    }
    .project-card-desc {
      display: block;
      margin-top: 4px;
      font-size: 14px;
      color: #57606a;
    }
  </style>
</head>
<body>
  <!-- 语言切换：结构与 control-flex 站点一致，当前语言为不可点的 span，另一项为链接 -->
  <div class="page-top">
    <div class="lang-switch" id="lang-switch" role="group" aria-label="Language"></div>
  </div>

  <!-- 带有 data-i18n 属性的元素，用于被 JS 替换文字 -->
  <h1 data-i18n="greeting">Hello!</h1>
  <p data-i18n="description">This is the GitHub Pages site for ifels.</p>

  <!-- 项目入口 -->
  <h2 class="section-title" data-i18n="projectsTitle">Projects</h2>
  <a class="project-card" href="control-flex/">
    <span class="project-card-title" data-i18n="wikiTitle">Control Flex Wiki</span>
    <span class="project-card-desc" data-i18n="wikiDesc">Documentation for the Control Flex controller mod: player guide, modpack compatibility, and developer API.</span>
  </a>

  <script>
    var LANG_KEY = 'preferredLang';
    var LANGS = ['en', 'zh'];
    var LABELS = { en: 'English', zh: '中文' };

    var translations = {
      en: {
        greeting: "Hello!",
        description: "This is the GitHub Pages site for ifels.",
        projectsTitle: "Projects",
        wikiTitle: "Control Flex Wiki",
        wikiDesc: "Documentation for the Control Flex controller mod: player guide, modpack compatibility, and developer API."
      },
      zh: {
        greeting: "你好！",
        description: "这是 ifels 的 GitHub Pages 站点。",
        projectsTitle: "项目",
        wikiTitle: "Control Flex 文档站",
        wikiDesc: "Control Flex 手柄模组的文档：玩家指南、整合包与兼容、开发者 API，支持中英文切换。"
      }
    };

    // 读取顺序与站点一致：?lang= → localStorage → 浏览器语言
    function resolveLang() {
      var q = new URLSearchParams(location.search).get('lang');
      if (q && LANGS.indexOf(q) >= 0) {
        try { localStorage.setItem(LANG_KEY, q); } catch (e) {}
        return q;
      }
      var saved = null;
      try { saved = localStorage.getItem(LANG_KEY); } catch (e) {}
      if (saved && LANGS.indexOf(saved) >= 0) return saved;
      var nav = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
      return String(nav).toLowerCase().split('-')[0] === 'zh' ? 'zh' : 'en';
    }

    // 当前语言渲染为 span，另一语言渲染为链接（无 JS 时也能通过 ?lang= 切换）
    function renderSwitch(lang) {
      document.getElementById('lang-switch').innerHTML = LANGS.map(function (code) {
        if (code === lang) {
          return '<span class="lang-current" aria-current="true" lang="' + code + '">' + LABELS[code] + '</span>';
        }
        return '<a href="?lang=' + code + '" hreflang="' + code + '" lang="' + code +
               '" data-set-lang="' + code + '">' + LABELS[code] + '</a>';
      }).join('');
    }

    function setLanguage(lang) {
      document.documentElement.lang = lang;

      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        var key = el.getAttribute('data-i18n');
        if (translations[lang][key]) el.textContent = translations[lang][key];
      });

      renderSwitch(lang);

      try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    }

    document.getElementById('lang-switch').addEventListener('click', function (event) {
      var link = event.target.closest('a[data-set-lang]');
      if (!link) return;
      event.preventDefault();
      setLanguage(link.getAttribute('data-set-lang'));
    });

    setLanguage(resolveLang());
  </script>
</body>
</html>
