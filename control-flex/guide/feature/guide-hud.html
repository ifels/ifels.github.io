<script>
(function () {
  var path = "guide/feature/guide-hud.html";
  var supported = ["en", "zh"];
  var lang = null;
  var q = new URLSearchParams(location.search).get('lang');
  if (q && supported.indexOf(q) >= 0) {
    lang = q;
    try { localStorage.setItem('preferredLang', q); } catch (e) {}
  } else {
    try { lang = localStorage.getItem('preferredLang'); } catch (e) {}
    if (!lang) {
      var nav = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
      lang = String(nav).toLowerCase().split('-')[0];
    }
  }
  if (supported.indexOf(lang) < 0) lang = "en";
  location.replace("../../" + lang + '/' + path);
})();
</script>
